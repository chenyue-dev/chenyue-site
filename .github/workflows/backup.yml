name: Backup Supabase data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Export database and media
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: media
        run: node outputs/tools/backup.mjs

      - name: Create encrypted archive
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          tar -czf backup.tar.gz -C backups .
          gpg --batch --yes --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 backup.tar.gz

      - name: Publish encrypted backup release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="backup-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" backup.tar.gz.gpg \
            --title "Encrypted backup $TAG" \
            --notes "Encrypted Supabase and media backup generated automatically."

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: shuaistack-backup-${{ github.run_number }}
          path: backups/
          if-no-files-found: error
          retention-days: 90
